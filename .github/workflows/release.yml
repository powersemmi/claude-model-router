name: Release

# A tag `v<version>` that matches the version in Cargo.toml builds the Linux x86_64 binary and
# publishes it as a GitHub release, with generated notes. Re-running the workflow for the same
# tag replaces the uploaded files.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: An existing tag to build and publish, such as v0.1.0
        required: true

permissions: {}

jobs:
  linux-x86_64:
    name: Linux x86_64 binary
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      TARGET: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - name: Verify the version matches the tag
        run: |
          VERSION=$(cargo metadata --format-version 1 --no-deps \
            | jq -r '.packages[] | select(.name == "claude-model-router") | .version')
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "Tag '$TAG' does not match the crate version '$VERSION'"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}

      - name: Build
        run: cargo build --release --locked --target "$TARGET"

      - name: Package
        run: |
          set -euo pipefail
          name="claude-mr-${VERSION}-${TARGET}"
          mkdir -p "dist/$name"
          cp "target/$TARGET/release/claude-mr" README.md LICENSE "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
          echo "ASSET=dist/$name.tar.gz" >> "$GITHUB_ENV"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" "$ASSET.sha256" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$ASSET" "$ASSET.sha256" --generate-notes \
              --verify-tag --repo "$GITHUB_REPOSITORY"
          fi
